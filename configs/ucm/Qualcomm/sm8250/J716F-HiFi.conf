# Lenovo Xiaoxin Pad Pro 2021 (J716F) - SM8250 + 4x CS35L41
# Speaker path uses Primary MI2S (vendor mixer: PRIM_MI2S_RX).
SectionVerb {
	EnableSequence [
		cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"
	EnableSequence [
		cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SPK1 PCM Source' ASP"
		cset "name='SPK2 PCM Source' ASP"
		cset "name='SPK3 PCM Source' ASP"
		cset "name='SPK4 PCM Source' ASP"
		cset "name='SPK1 Analog PCM Volume' 17"
		cset "name='SPK2 Analog PCM Volume' 17"
		cset "name='SPK3 Analog PCM Volume' 17"
		cset "name='SPK4 Analog PCM Volume' 17"
		cset "name='SPK1 Digital PCM Volume' 817"
		cset "name='SPK2 Digital PCM Volume' 817"
		cset "name='SPK3 Digital PCM Volume' 817"
		cset "name='SPK4 Digital PCM Volume' 817"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
